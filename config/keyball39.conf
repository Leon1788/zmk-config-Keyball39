# ============================================
# KEYBALL 39 BT - OPTIMIERTE ZMK CONFIG
# FIX: Wake-Up Lag / First Keystroke Latency
# ============================================

# --- BLUETOOTH STABILITÄT (ORIGINAL, FUNKTIONIERT) ---
# ABER: Aggressivere Parameter für schnellere Response
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- BLE CONNECTION PARAMETERS (AGGRESSIV) ---
# WICHTIG: Kleine Werte = schnellere Reaktion nach Idle!
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# --- ZMK STABILITÄTS-FIXES (ZWINGEND FÜR NICE!VIEW UND SPLIT) ---
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# --- DISPLAY SETTINGS ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# --- POWER MANAGEMENT ---
# 30 Minuten bis Display aus (nicht Deep Sleep!)
CONFIG_ZMK_IDLE_TIMEOUT=1800000
# Deep Sleep nach 2 Stunden (Akku sparen)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
