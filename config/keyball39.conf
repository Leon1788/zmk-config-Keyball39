# --- BLUETOOTH STABILITÄT (ORIGINAL, WEIL ES FUNKTIONIERT) ---
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK STABILITÄTS-FIXES (ZWINGEND FÜR NICE!VIEW UND SPLIT)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# --- DISPLAY SETTINGS ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
# FIX 1: Lagert das Display in den Hintergrund aus, damit es die Tasten nie blockiert!
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# --- POWER MANAGEMENT (DIE LÖSUNG GEGEN DEN LAG) ---
# FIX 2: Standard-Idle (kurzes Abschalten des Displays) auf 30 Minuten (1.800.000 ms) setzen.
# (Vorher waren es 30 Sekunden, deshalb lag es nach jeder kleinen Tipp-Pause)
CONFIG_ZMK_IDLE_TIMEOUT=1800000

# Tiefer Schlaf (Deep Sleep) schont den Akku, wenn du gar nicht am PC bist (nach 2 Stunden)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
